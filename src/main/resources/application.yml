micronaut:
  server:
    port: ${server.port}
    host: ${server.host}
  router:
    static-resources:
      default:
        enabled: true
        mapping: "/**"
        paths: "file:frontend"
  application:
    name: liberty_Web
  caches:
    caffeine:
      enabled: true
      specs:
        username-cache:
          maximum-size: ${caffeine.username.maxSize}
          expires-after-write: ${caffeine.username.expiration}
        requests:
          maximum-size: ${caffeine.requests.maxSize}
          expires-after-write: ${caffeine.requests.expiration}
netty:
  default:
    allocator:
      max-order: 3
